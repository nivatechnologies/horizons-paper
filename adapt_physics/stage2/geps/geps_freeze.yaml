# GEPS FREEZE: Adapt the Physics, GEPS as a learned adaptive opponent. Committed before any test-panel evaluation.
# Gate: GEPS_GATE.md. Scope reduced by Todd's ruling (2026-09-28; feasibility), recorded in the gate and here.

code:
  repository: https://github.com/itsakk/geps
  commit: e9a865218ecffacb7007ac7d719f3741afcf8c02
  license: "no license file in the repository; not vendored - cloned on the Sparks and imported unmodified"
  variant: "fully data-driven (type_augment = ''); Forecaster('kolmo', state_c=1, hidden_c=64, code_c=4, factor=1, n_env, is_complete=True, '', method, None)"
  wrapper: adapt_physics/stage2/geps/geps_run.py
  efficiency: "adapt_physics/stage2/geps/geps_fast.py: exact low-rank reformulation of GEPSConv2D, GEPSLinear1D, GEPSSpectralConv2d_fast (verified: 1.2e-6 / 2.0e-7 / 2.1e-7 relative per layer; full-model 20-frame rollout 1.7e-7); TF32 off"

environment:
  hosts: {spark_a: "192.168.88.4 (spark-89d8)", spark_b: "192.168.88.12 (gx10-5278)"}
  arch: aarch64
  gpu: "NVIDIA GB10, compute capability 12.1, 121 GiB unified memory"
  torch: "2.13.0+cu130 (CUDA 13.0), torchdiffeq, venv ~/geps_work/venv"
  env_vars: "TORCH_DISABLE_NATIVE_JIT=1 (torch native-op Triton JIT disabled -> ATen kernels; Triton's build needs Python headers not installed)"
  vllm: "two-node TP=2 deployment (~/qwen38-mia) stopped with ./stop.sh on the head; restart with ./start.sh --launch"

architecture_and_recipe:
  source: "paper Table 12 (Kolmogorov column) + train.py / adapt.py"
  model: "GEPS FNO2d: 10 x 10 modes, width 64, 4 Fourier layers + 7x7 circular convs, Swish (context-conditioned), low-rank context adaptation in every layer, context size c = 4; output x 0.0005; NeuralODE integrated with the released code's hard-coded Euler (one step per output time) - the paper says RK4"
  params: 4608058
  init: "orthogonal gain 1 for A, B, weight (released bash template)"
  training: "Adam lr 1e-2 betas (0.9, 0.999); ReduceLROnPlateau(factor 0.9, patience 350, threshold 0.01 rel, min_lr 1e-5) on the epoch train loss; RelativeL2 on the rollout; batch 4; 20,000 epochs capped at 8 h wall (cap binds); no teacher forcing; grad-norm clip after the step as released"
  data_mapping: "vorticity x 64 / sigma_A(Re 40, World D); t = 0.35 k; one environment per training trajectory (1,024); one random 20-frame window per trajectory per epoch (published trajectory length); +2% sigma_A white noise on the initial frame, clean targets"
  selection: "validation RelativeL2 every 50 epochs on 64 fixed 20-frame windows of val_range (mean training code); best kept"
  models: {GEPS-range: "World D Re U[34, 46] set (as L_range, FNO-Re), seed 0, Spark A; published lr 1e-2 run (00:13 UTC) collapsed to persistence and was archived; evaluated model = lr 1e-3 retrain geps_range_s0_lr0.001 (see deviation_GEPS_range_retrain)", GEPS-wide: "World D Re U[30, 60] set, seed 0, Spark B"}
  deviation_GEPS_wide_lr: "DEVIATION (Todd 2026-09-28): at the published lr 1e-2 GEPS-wide diverged in its first epoch (train RelativeL2 46.6, validation NaN; run geps_range_wide_s0, stopped). Retrained at lr 1e-3 (run geps_range_wide_s0_lr0.001), otherwise identical, capped to end by 08:10 UTC (7.57 h). GEPS-range keeps the published 1e-2."
  finding_published_recipe_collapse: "FINDING (recorded separately from the deviations): at the published lr 1e-2, GEPS-range collapsed to persistence. Validation RelativeL2 at epoch 50 = 0.7266750, equal to the no-change forecast on the same 64 windows (0.7266750; epoch 0: 0.7266754). The run was killed at 07:12 UTC (about 74 epochs) and archived on Spark A as runs/ARCHIVED_geps_range_s0_lr0.01_collapsed_DO_NOT_EVALUATE. It was never evaluated on a test panel. Only validation windows (val_range) were used to detect this. EVIDENCE (checked 2026-09-28 on the epoch-0 checkpoint, the epoch-50 checkpoint and a fresh CPU initialization; weights only): (a) 'epoch 0' validation is after the first epoch (256 optimizer steps), not before training. (b) The weights did move: in the first epoch the trunk grew far from its orthogonal init (w0 norm 8.0 -> 37.5, w3 8.0 -> 25.8, spectral conv0.weights1 0.13 -> 94), then froze: between epochs 0 and 50 every Fourier and conv trunk tensor changed by <= 5.4e-9 (Adam with vanishing gradients), while the head and contexts kept moving (fc1.bias up to 1.66, codes norm 4.5 -> 8.3, fc2.A up to 0.62). No step was skipped: no AMP/grad-scaler, no NaN/inf guard; the released clip_grad_norm_ runs after optimizer.zero_grad(), so it never clips (the wrapper reproduces that order). No tensor is non-finite. (c) The initialization is effectively, not exactly, persistence: the output is scaled by 0.0005 and the contexts start at 0, so over the 19-step window the initial model moves the state by 3.1e-5 of its norm (true change 0.905); validation 0.7266729 vs persistence 0.7266749 (CPU recomputation). The trained model's change is 1.2e-3 at epoch 0 and 9.9e-5 at epoch 50; its validation stays within 5e-7 of persistence at every checkpoint. So: large unclipped first-epoch updates at lr 1e-2, then vanishing trunk gradients, with the function never leaving persistence; GEPS-wide diverged to NaN within its first epoch at the same lr."
  deviation_GEPS_range_stopping_rule: "PRE-REGISTERED DEVIATION (Todd 2026-09-28, recorded 08:05 UTC; replaces the ~08:14 UTC time cap of run geps_range_s0_lr0.001): checks every 2 epochs on the same 64 validation windows; STOP once validation loss has improved by less than 1% of the previous check (improvement = (previous - current) / previous, a worsening counts as < 1%) at two consecutive checks; otherwise stop at 50 epochs (matching GEPS-wide; epochs 0-49, last check at epoch 48). Checkpoint: best on validation (unchanged). Timing disclosure: the epoch-8 check (0.3495375 against 0.3483525 at epoch 6, i.e. -0.34%, < 1%) had already been logged at ~08:02 UTC, before this rule was recorded; the rule counts it as the first of two consecutive checks, so it is pre-registered for the checks from epoch 10 on. Checks so far: 0:0.5644766 2:0.4354147 4:0.4316104 6:0.3483525 8:0.3495375."
  extension_resume: "RECORDED (2026-09-28 08:17 UTC): epoch 10 = 0.3225729 (7.7% better than epoch 8), so the stopping rule did not fire and the run was extended. The running process's 1.02 h cap was fixed at launch, and its code saved no optimizer state, so a restart was unavoidable. The capped process ended at 08:14 UTC mid-epoch 11 (168 of 256 steps; 2,984 steps in total), writing last.pt (kept as last_at_cap_0814.pt). It was resumed at 08:14:21 UTC as epoch 12 from those WEIGHTS ONLY: Adam moments, the plateau-scheduler counters (lr still 1e-3; patience 350 never reached) and the window-sampling RNG are FRESH (the RNG is re-seeded as default_rng([seed, 12])). The step count continues at 2,984 and the validation history and best (epoch 10) carry over. The resumed code saves full state (weights, Adam, scheduler, RNG) at every check. Watcher: triggers when the resumed process ends (stopping rule or epoch 50), with a safety deadline of 13:00 UTC (kill, then evaluate from best-on-validation), replacing 09:00. It loads only runs/geps_range_s0_lr0.001/best.pt; the archived lr 1e-2 checkpoint is in a differently named directory, which nothing references."
  finding_clipping_never_applies: "FINDING (2026-09-28): the released train.py (itsakk/geps @ e9a8652) calls torch.nn.utils.clip_grad_norm_(model.parameters(), 1.) at train.py:158, after optimizer.step() (train.py:156) and optimizer.zero_grad() (train.py:157), so the gradients are already cleared and gradient clipping never takes effect. Our wrapper copies that order (geps_run.py train(): opt.step(), opt.zero_grad(), clip_grad_norm_), so every GEPS run trained UNCLIPPED: the archived GEPS-range lr 1e-2 run, GEPS-wide at lr 1e-2 and 1e-3, and the GEPS-range lr 1e-3 retrain. lr 1e-2 has therefore not been tested with the clipping the recipe intends. The reading states that the result cannot tell whether GEPS needs the lower lr or only working clipping. (Adaptation is unaffected: adapt.py has no clipping.)"
  deviation_GEPS_range_retrain: "DEVIATIONS (Todd 2026-09-28, after the finding above; no test panel touched): GEPS-range retrained (run geps_range_s0_lr0.001, Spark A, 07:12 to ~08:14 UTC) with (1) lr 1e-2 -> 1e-3, the same change as GEPS-wide, otherwise the published recipe; (2) validation cadence 50 -> 2 epochs, on the same 64 windows; (3) about 12 epochs trained, against 50+ for GEPS-wide and 20,000 published; (4) checkpoint = best validation loss (as before). Collapse stop: at epoch 4, if validation is within 1e-4 of persistence (0.7266750), halt, start no GEPS-range evaluation, and diagnose (output head init; residual/delta path stuck at zero) without starting another run. Second seed: not run. It would have to be evaluated too, doubling the reading cells (~6.5 Spark-hours each), and could not finish by ~14:50; so GEPS-wide keeps running to its cap and one GEPS-range seed is trained. The reading states the GEPS-range epoch count beside its score and labels the model undertrained if validation loss was still falling at the last two validations."
  timing_pilot: "training data only: ~1.2 s per training step at batch 4 (after the reformulation). Batched adaptation pilot (Spark B, training data train_range_wide, GEPS-range epoch-0 checkpoint; throughput does not depend on the weights; FP32): 88.9 / 85.5 / 83.3 / 85.1 ms per state-step at B = 25 / 50 / 100 / 150 (peak 10.9 / 21.1 / 42.0 / 62.8 GB). TF32 on: 60.8 ms at B = 50 (not used: numerics deviation)"

adaptation:
  procedure: "adapt.py: codes <- mean training code; all weights frozen; Adam lr 1e-2 on the code only; ReduceLROnPlateau(0.9, patience 50, 0.01 rel, min_lr 1e-5) on the epoch loss; MSE of the rollout"
  per_state_data: "the w = 11 noisy post-change frames as one trajectory (rollout from frame 1); forecast from frame 11 with the adapted context"
  budgets: {default: 500, ten_x: 5000}
  batching: "many states in one pass, weights frozen, per-state losses summed; per-state Adam + plateau schedule (identical to one optimizer per state; checked: 2.3e-7 relative after 60 steps); Adam is elementwise and adapt.py has no gradient clipping"
  no_adaptation_reference: "one shared context fitted (500 steps, same procedure) on 32 Re-40 nominal trajectories x 11 frames as one environment; used for every test state"
  timing: "batch 1, one state at a time, on a Spark: states 3-22 of s2_test_Re50_D (0-2 warm-up) at the default budget; 10x budget on states 3-5 (0-2 warm-up; time-bound; recorded); forecast of the fixed F = 111 frames"

scope:
  ruling: "Todd 2026-09-28: first N states of the fresh World D panels; both budgets at Re 50 and 56; no-adaptation at Re 50; N = largest leading count in [50, 300] finishing by 14:30 UTC across both Sparks, from a batched-throughput pilot on training data"
  N: 50
  N_derivation: "Work at N: 11,000 adapted state-steps per state (500 + 5,000 at Re 50 and at Re 56) x ~85 ms (pilot, FP32, B = 50) = ~935 s per state, plus ~1,400 s for the no-adaptation reference fit and forecasts. Capacity: both Sparks from ~08:15 UTC (training caps end 08:10 / 08:13) to 14:30 UTC = ~45,000 Spark-seconds -> N ~ 42 < 50, so N takes the floor 50 (Todd 2026-09-28: proceed at FP32 with N = 50; finishing after 14:30 accepted). TF32 (61 ms) and stopping GEPS-range training early were offered and declined."
  projected_finish: "reading cells (both budgets at Re 50 and 56) ~14:50 UTC; no-adaptation at Re 50 ~15:10 UTC; batch-1 timing ~15:40 UTC"
  run_order: "reading cells first: Spark A Re 50 adapt5000 then adapt500; Spark B Re 56 adapt5000 then adapt500 (states 0-49, one batched pass each); then no-adaptation at Re 50 (Spark B); then batch-1 timing on Spark A (default budget: 3 warm-up + 20 timed states; 10x budget: 3 warm-up + states 3-5)"
  training_deadline: "Todd 2026-09-28: a training process still running at 09:00 UTC is killed by PID (SIGTERM; SIGKILL after 120 s; never during a best.pt write - the kill waits until best.pt is >= 30 s old), and the evaluations start from its validation-selected best.pt (checked to load); not an abort. Expected not to bind (caps end 08:10 / 08:13). Whether it bound is recorded in the session review."
  geps_wide_evaluation: "cut: by Todd's rule it runs only if both GEPS-range budgets at N finish by 14:30 UTC; projected ~14:50, so it stays cut"
  cut: ["Re 36, 40, 44", "GEPS-wide evaluation", "H timing on the Spark", "GEPS-range seeds 1 and 2"]
  scoring: "w = 11, eps 0.1 primary / 0.3 secondary, future frames; restricted mean, S(1), S(3), retention; paired H - GEPS with a bootstrap over trajectories (one seed); Part A values of H, L_range, L_range-wide, FNO-Re beside, on the same N states"

reading:
  claim: "A learned adapter built for parametric PDEs does not close the gap"
  rule: "at Re 50 AND Re 56 (World D, first N states): H - GEPS-range at the better of its two budgets (chosen per Re; part of the reading) >= 0.25 with the 95% interval excluding 0 -> stated; otherwise GEPS reported prominently and Todd decides the headline"
  not_read: "GEPS-wide; in-range Re (cut)"

post_freeze_followups:
  status: "POST-FREEZE FOLLOW-UPS (Todd 2026-09-28). Not substitutes in the frozen reading, which uses the Spark GEPS-range run geps_range_s0_lr0.001 only."
  host: "Baccus, 3x NVIDIA CMP 170HX (Qwen 3.8 27B vLLM services stopped 08:05 UTC; restart when these runs end); torch 2.13.0+cu130; torchdiffeq 0.2.5 and einops 0.8.2 (the Sparks' versions) from a --target dependency dir; working copy ~/geps_baccus"
  code: "itsakk/geps @ e9a8652 (unmodified) + geps_run.py (same file as the Sparks, md5 8ee26e9c), released clip order unchanged (unclipped); same train_range data and the same 64 validation windows (md5-checked against the Sparks); no test panel on Baccus"
  timing: "0.934 s per training step (batch 4, 20-frame window) = 239 s per 256-step epoch on a 170HX, against ~310 s on a Spark GB10"
  published_budget: "20,000 epochs (paper Table 12). On GEPS's Kolmogorov data (8 environments x 16 trajectories, batch 4) that is 32 steps per epoch = 640,000 steps. On our data (1,024 trajectories, 256 steps per epoch), 20,000 epochs = 5.12 M steps (~55 days per run); the step-matched budget is 2,500 of our epochs (~6.9 days per run)"
  runs:
    gpu0: "GEPS-range lr 1e-3, seed 0, validation every 2 epochs, best-on-validation, full state saved at every check; launched 08:15 UTC with max_epochs 2,500 (step-matched) pending Todd's budget decision"
    gpu1: "same, seed 1"
    gpu2: "see reproduction_kolmogorov below; afterwards GEPS-range seed 2 (lr 1e-3, same setup as seed 1)"

choices_2026_09_28_evening:
  context: "Todd offline from ~18:00 UTC; instructions: act without waiting and record every choice here. Spark .12, vLLM and Qwen are not gates; Qwen stays off until the Baccus runs finish; .12 is ignored."
  spark_b_outage: "Spark B (192.168.88.12) stopped answering ssh and ping ('No route to host') at ~10:16 UTC, right after its evaluation chain (Re 56 cells, no-adaptation) was launched; none of its outputs could be retrieved. The Re 56 cells (5,000 and 500 steps) and no-adaptation at Re 50 were re-queued on Spark A at 17:55 UTC, after its batch-1 timing, with the same code and checkpoint (geps_range_s0_lr0.001 best.pt, md5 4564f594), finishing ~02:00 UTC. They were deliberately not moved to Baccus: adaptation takes gradient steps and seed 0 diverged on the 170HX. A detached watcher then publishes the full reading. vLLM is not restarted while .12 is down (the deployment spans both Sparks)."
  gpu_state_training: "GEPS-range trained on Spark A stopped under the pre-registered rule at epoch 34 (checks at 32 and 34 each < 1% improvement): 35 epochs, best validation 0.2430717 at epoch 30 or later (see train.log), persistence 0.7266750."
  horizon_sanity_check: "Done before headlining (stage2/geps/geps_sanity.py; results/geps_sanity.json, geps_sanity_err_Re50.csv/.png; CPU; only the frozen Re 50 cells' states and frames). (1) Persistence on the same 50 states: horizon 0.110 (first frame over 0.1 at frame 1). GEPS-range: 0.201 (frame 2). H seed 0: 3.25. (2) Median error / sigma_A at frames 1 and 2: GEPS 0.094, 0.142; persistence 0.205, 0.397; H 0.005, 0.005. (3) Same code path: GEPS and Part A errors are both ||x_hat(w+j) - x(w+j)||_2 / sigma_A with row 0 = the noisy observation at k = w and the same Truth frame indexing; all arms are scored by th.score.horizon(err, lam, 0.35, 10, eps 0.1, start 1) in geps_analysis.py. (4) Consistency: the validation-style RelativeL2 over a 20-frame window from k = w, computed from GEPS's own errors on the Re 50 cells, is 0.356, against 0.243 on the in-range validation windows; persistence gives 0.835 there against 0.727 on validation, so both degrade by a similar factor out of range. A horizon of ~2 frames (0.20 Lyapunov times) is consistent with that error level. (5) The 500- and 5,000-step budgets give the same horizon because adaptation converges within 500 steps: final per-state losses and context norms agree to ~7 digits (horizon-relevant errors differ by <= 0.017)."
  finding_seed0_divergence_170HX: "FINDING: GEPS-range seed 0, lr 1e-3, identical code (geps_run.py md5 8ee26e9c, itsakk/geps @ e9a8652), data and validation windows, trained normally on the Spark GB10 (epoch-0 validation 0.5645) but diverged on a Baccus CMP 170HX, UNCLIPPED (released clip order). From the existing logs only: the epoch-0 mean training loss is finite (0.5818 vs 0.5822 on the Spark), so all of steps 1-256 had finite losses; the first non-finite value is the epoch-0 validation (after the update of step 256); the epoch-2 mean training loss is NaN, so the first non-finite training loss lies in steps 257-768. Loss and gradient norm per step were not logged (the released-order clip_grad_norm_ runs after zero_grad and records nothing), and only the latest full state (epoch 132) was kept, in which 69 of 72 tensors (all but the three unused physics parameters) and all 68 Adam states are non-finite; which tensor went non-finite first cannot be determined from what exists, and no best.pt was ever written. The run was stopped at 17:52 UTC after 9.6 h."
  followup_trained_longer: "Post-freeze follow-up 'GEPS-range trained longer' (not a substitute): seed 1's best-on-validation checkpoint at 17:41 UTC (epoch 130, validation 0.1619857, persistence 0.7266750; snapshot runs/followup_s1_ep130, md5 ab2122ae) on the frozen reading cells (Re 50 and 56, states 0-49, 500 and 5,000 steps), Baccus GPU 0, order 500 at Re 50, 500 at Re 56, 5,000 at Re 50, 5,000 at Re 56; every cell checked finite (err, contexts, adaptation loss) before the next; a non-finite cell stops the chain."
  reproduction_kolmogorov: "Post-freeze follow-up, Baccus GPU 2, started 18:04 UTC, 12 h cap: released train.py on GEPS's own Kolmogorov data (its generator geps/datasets/kolmo.py via param_kolmo: 8 environments, 16 training and 32 test trajectories each), Table-12 recipe via Hydra overrides only (lr 1e-2, batch 4, width 64, context 4, orthogonal init gain 1, 20,000 epochs requested, data seed 123 as in train.yaml, val batch 32 as in train.yaml), wandb offline. SPEC ERRORS in the released code, handled without editing any released file (a sitecustomize.py on PYTHONPATH): (a) geps/datasets/__init__.py imports geps.datasets.lv, which is absent from the repository at e9a8652, so train.py cannot import as released; a placeholder module is registered (Lotka-Volterra is never used here); (b) train.py passes verbose=True to ReduceLROnPlateau, which torch 2.13 rejects; the argument (it only printed lr changes) is dropped. Verdict rule: validation (the released loss_test_in, every 100 epochs) against persistence on the same test data; the paper's in-distribution Kolmogorov number is 2.94 +/- 0.04 x 1e-1 (Table 2). When it ends, GEPS-range seed 2 (lr 1e-3, same setup as seed 1) starts on GPU 2 automatically."
  qwen: "Qwen 3.8 vLLM services on Baccus stay stopped until the Baccus runs finish (Todd)."
