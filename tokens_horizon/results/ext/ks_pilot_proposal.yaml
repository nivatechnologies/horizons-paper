# Kuramoto-Sivashinsky pilot: PROPOSED values for EXT_FREEZE part 2. Post-freeze extension.
# Every number here is "estimate (pilot)" from scripts/ext_ks_pilot.py (results/ext/ks_pilot.json). No tokenizer, bound,
# decode-and-integrate or confirmation data was touched. Values become frozen only when copied into ext_freeze.yaml part 2.
label: "estimate (pilot)"
module: th/ks.py
equation: "u_t = -u u_x - u_xx - u_xxxx on [0, L), periodic, zero mean"
discretization:
  method: "Fourier pseudo-spectral Galerkin, rfft on N grid points; state = real-space u(x_j), j = 0..N-1"
  dealiasing: "Orszag 2/3 rule: retain modes 1 <= m <= M = floor((N-1)/3) in the state and the nonlinear term; mode 0 = 0 (zero mean); Nyquist and m > M identically zero; exact Galerkin truncation, 2M real dof"
  time_stepping: "ETDRK4 (Cox & Matthews 2002), phi-coefficients by contour integral, 64 points, radius 1 (Kassam & Trefethen 2005)"
  dtype: float64
  initial_conditions: "0.01 * N(0,1) per grid point, projected on retained zero-mean modes, then burn-in"

systems:
  ks22:
    system_index: 6
    L: 22.0
    N: 64
    M_retained_modes: 21
    dt: 0.1
    burn_in_time: 1000.0          # 10,000 steps, 48 Lyapunov times (Lorenz: 50 tu = 45 Lyapunov times)
    lyapunov:                     # dt 0.1, 16 starts x 20,000 tu (969 Lyapunov times), 14 exponents, QR every 1 tu
      lam_max: 0.048445
      lam_max_se: 0.000320
      d_ky: 4.2412
      d_ky_se: 0.0021
      spectrum_head: [0.0484, 0.0005, -0.0001, -0.0036, -0.1879, -0.2570, -0.2904, -0.3105, -1.9629, -1.9674]
    frame_intervals: [0.4, 1.0, 2.0]          # lambda*Delta = 0.0194, 0.0484, 0.0969 (Lorenz ratios 1:2.5:5, all x1.07)
    frame_intervals_alternative: [0.4, 0.9, 1.9]   # closest to 0.018/0.045/0.09: 0.0194, 0.0436, 0.0920 (needs storage every dt)
    window_time: 557.35           # W / lambda = 27 / 0.048445
    pre_history_time: 121.5       # 5.885 Lyapunov times (Lorenz 6.5 tu x 0.905)
    post_time: 561.4              # W/lambda + 4.0 tu (Lorenz +0.2 tu = 0.18 Lyapunov times -> 3.7 tu, rounded up)
    context_time: 61.6            # 2.99 Lyapunov times (Lorenz 3.3 tu); frames 154 / 62 / 31 at 0.4 / 1.0 / 2.0
    panel_store_every: 0.2        # gcd of the frame intervals; subsampled, no interpolation
    patch_length_points: {8: 8, 16: 4, 32: 2}  # P patches -> N/P grid points (2.75, 1.375, 0.6875 length units)
    sigma_A_pilot: 9.478          # s.e. 0.012; Euclidean norm over 64 grid points (per-point RMS 1.185)
  ks100:
    system_index: 7
    L: 100.0
    N: 256
    M_retained_modes: 85
    dt: 0.1
    burn_in_time: 500.0           # 5,000 steps, 45 Lyapunov times
    lyapunov:                     # dt 0.1, 16 starts x 10,000 tu (906 Lyapunov times), 40 exponents, QR every 0.5 tu
      lam_max: 0.090626
      lam_max_se: 0.000337
      d_ky: 21.477
      d_ky_se: 0.014
      spectrum_head: [0.0906, 0.0771, 0.0664, 0.0575, 0.0495, 0.0416, 0.0347, 0.0275, 0.0205, 0.0131, 0.0053, 0.0001, -0.0001, -0.0031]
    frame_intervals: [0.2, 0.5, 1.0]          # lambda*Delta = 0.0181, 0.0453, 0.0906 (Lorenz x10 in time)
    window_time: 297.93           # 27 / 0.090626
    pre_history_time: 65.0        # 5.89 Lyapunov times
    post_time: 300.0              # W/lambda + 2.07 tu (0.19 Lyapunov times)
    context_time: 33.0            # 2.99 Lyapunov times; frames 165 / 66 / 33
    panel_store_every: 0.1
    patch_length_points: {8: 32, 16: 16, 32: 8}  # 12.5, 6.25, 3.125 length units
    sigma_A_pilot: 20.994         # s.e. 0.015; Euclidean norm over 256 grid points (per-point RMS 1.312)
  larger_domain_justification: >
    L = 100: D_KY about 21.5 (5x L = 22; Edson et al. 2019 Table 1 give 22.44 on their convention), well into the
    extensive regime D_KY ~ 0.226 L (Edson et al. 2019, L >~ 80), N = 256 at the same grid spacing class as L = 22
    (0.39 vs 0.34), and frame intervals land on Lorenz lambda*Delta exactly. L = 200 would double the state and
    Benettin cost for no qualitative change of regime.

seeds:
  scheme: "block_base + 100 * system_index + stream (freeze.yaml), new system indices ks22 = 6, ks100 = 7 (kolmogorov = 8 suggested)"
  block_base: {calibration: 10000, training: 20000, validation: 30000, confirmation: 40000, lyapunov: 50000, pilot: 60000}
  used_by_pilot: "lyapunov 50600-50615 and 50700-50715 (one start per stream); pilot 60601-60603 and 60701-60703 (resolution, spectrum tail, sigma_A)"

blocks:
  calibration:
    ks22: {n_traj: 1000, samples_per_traj: 1000, sample_every: 2.0, states: 1000000, memory_float64_GB: 0.51,
           note: "2^16 whole-state codes -> 15 states per code; P = 8/16/32 patches -> 8M/16M/32M patch samples (0.51 GB each)"}
    ks100: {n_traj: 1000, samples_per_traj: 1000, sample_every: 1.0, states: 1000000, memory_float64_GB: 2.05,
            note: "patches only at 2^16 codes: 8M/16M/32M patch samples"}
    spacing_note: "0.097 / 0.091 Lyapunov times between samples (Lorenz 0.1 tu = 0.091)"
  training:
    ks22: {n_traj: 100, traj_time: 375.0, total_time: 37500.0, lyapunov_times: 1817, store_every: 0.2, n_traj_data_axis: 1000, memory_GB: 0.096}
    ks100: {n_traj: 100, traj_time: 200.0, total_time: 20000.0, lyapunov_times: 1813, store_every: 0.1, n_traj_data_axis: 1000, memory_GB: 0.41}
  validation:
    ks22: {n_traj: 50, traj_time: 375.0}
    ks100: {n_traj: 50, traj_time: 200.0}
  confirmation:
    panel_states: 1000
    ks22: {pre_history_time: 121.5, post_time: 561.4, store_every: 0.2, disk_float64_GB: 1.75}
    ks100: {pre_history_time: 65.0, post_time: 300.0, store_every: 0.1, disk_float64_GB: 7.5}

compute_estimates:   # measured single-process rate, batch 1,000, 1 FFT worker: ks22 2.30e5, ks100 7.06e4 state-steps/s
  confirmation_panel_1000: {ks22_s: 73, ks100_s: 122}
  decode_and_integrate_per_tokenizer_1000_states: {ks22_s: 24, ks100_s: 42}
  decode_and_integrate_40_tokenizers: {ks22_single_process_min: 16, ks100_single_process_min: 28, note: "about 1 min each on 32-40 processes"}
  calibration_block: {ks22_s: 130, ks100_s: 212, note: "integration only; k-means with 2^16 codes is separate (GPU, patchvq)"}
  training_block_data_axis_1000: {ks22_s: 60, ks100_s: 100}
