# Kuramoto-Sivashinsky pilot at the production dt = 0.005: PROPOSED values for EXT_FREEZE part 2 (post-freeze extension).
# Supersedes ks_pilot_proposal.yaml (dt = 0.1) for everything that depends on dt or lambda. All numbers are
# "estimate (pilot)" from scripts/ext_ks_pilot_dt0005.py (results/ext/ks_pilot.json key "dt0005"). No tokenizer,
# bound, decode-and-integrate or confirmation data was touched. Values become frozen only when copied into
# ext_freeze.yaml part 2.
label: "estimate (pilot)"
module: th/ks.py
equation: "u_t = -u u_x - u_xx - u_xxxx on [0, L), periodic, zero mean"
discretization:
  method: "Fourier pseudo-spectral Galerkin, rfft on N grid points"
  dealiasing: "Orszag 2/3 rule: modes 1 <= m <= M = floor((N-1)/3) retained in state and nonlinear term; mode 0 = 0; m > M (incl. Nyquist) identically 0"
  time_stepping: "ETDRK4 (Cox & Matthews 2002), contour-integral phi coefficients, 64 points, radius 1 (Kassam & Trefethen 2005)"
  dt: 0.005
  dtype: float64
  initial_conditions: "0.01 * N(0,1) per grid point, projected on the retained zero-mean modes, then burn-in"
output_contract:   # Amendment 1, A2
  scored_field: "real-space u on the N grid points, Euclidean norm over the N points; sigma_A in the same norm"
  true_states: "zero-mean and exactly band-limited to the retained 2/3 modes (1 <= m <= M) at all times, by construction of the integrator"
  decoded_states: "the concatenation of decoded patches (or the whole-state prototype) is scored as is; it is in general neither zero-mean nor band-limited, and no filtering, projection, dealiasing or mean correction is applied"
  decode_and_integrate: "the integrator projects its initial condition on the retained modes (rfft * mask); this projection applies only to the reference trajectory and is stated where the reference is reported"

systems:
  ks22:
    system_index: 6
    L: 22.0
    N: 64
    M_retained_modes: 21
    burn_in_time: 1000.0            # 200,000 steps, 49 Lyapunov times
    lyapunov:   # dt 0.005, 16 starts x 16,000 tu (783 Lyapunov times), full 42-exponent spectrum, QR every step
      lam_max: 0.048956
      lam_max_se: 0.000363
      d_ky: 4.2392
      d_ky_se: 0.0032
      spectrum_head: [0.0490, 0.0006, -0.0001, -0.0045, -0.1880, -0.2564, -0.2903, -0.3102, -1.9631, -1.9674]
      trace: -11663.737
      sum_minus_trace: 1.506          # relative 1.29e-4 (per start max 1.513; systematic, dt 0.0025 gives 2.0e-6)
    frame_intervals: [0.37, 0.92, 1.84]      # lambda*Delta = 0.01811, 0.04504, 0.09008
    window_time: 551.52                      # W / lambda = 27 / 0.048956
    pre_history_time: 120.25                 # 5.887 Lyapunov times (Lorenz 6.5 tu x 0.905345 = 5.885)
    post_time: 555.25                        # W/lambda + 3.73 tu (0.18 Lyapunov times, as Lorenz +0.2 tu)
    context_frames: {"0.37": 166, "0.92": 67, "1.84": 33}   # round(3.0 / (lambda*Delta)), about 3 Lyapunov times (A7)
    context_time: {"0.37": 61.42, "0.92": 61.64, "1.84": 60.72}
    storage: "one integration per trajectory, stored as three subsampled frame grids (every 74, 184, 368 steps) from the same trajectory; no interpolation"
    patch_length_points: {8: 8, 16: 4, 32: 2}  # 2.75, 1.375, 0.6875 length units
    sigma_A_pilot: 9.478                       # dt 0.1 pilot sample (statistic of the attractor; recompute on calibration)
  ks100:
    system_index: 7
    L: 100.0
    N: 256
    M_retained_modes: 85
    burn_in_time: 500.0             # 100,000 steps, 46 Lyapunov times
    lyapunov:   # dt 0.005, 16 starts x 10,000 tu (910 Lyapunov times), 40 exponents, QR every 20 steps
      lam_max: 0.091014
      lam_max_se: 0.000422
      d_ky: 21.481
      d_ky_se: 0.010
      spectrum_head: [0.0910, 0.0773, 0.0671, 0.0580, 0.0493, 0.0419, 0.0343, 0.0271, 0.0204, 0.0130, 0.0055, 0.0002, -0.0002, -0.0028]
      trace: -26836.400
      sum_minus_trace: 0.348          # relative 1.30e-5; separate full 170-exponent runs, same 16 starts, 200 tu
    frame_intervals: [0.2, 0.495, 0.99]      # lambda*Delta = 0.01820, 0.04505, 0.09010
    window_time: 296.66                      # 27 / 0.091014
    pre_history_time: 64.66                  # 5.885 Lyapunov times
    post_time: 298.65                        # W/lambda + 1.99 tu (0.18 Lyapunov times)
    context_frames: {"0.2": 165, "0.495": 67, "0.99": 33}
    context_time: {"0.2": 33.0, "0.495": 33.17, "0.99": 32.67}
    storage: "three subsampled frame grids (every 40, 99, 198 steps) from one integration"
    patch_length_points: {8: 32, 16: 16, 32: 8}   # 12.5, 6.25, 3.125 length units
    sigma_A_pilot: 20.994

seeds:
  scheme: "block_base + 100 * system_index + stream (freeze.yaml); new system indices ks22 = 6, ks100 = 7 (kolmogorov = 8 suggested)"
  block_base: {calibration: 10000, training: 20000, validation: 30000, confirmation: 40000, lyapunov: 50000, pilot: 60000}
  streams: {calibration_fit: 0, calibration_heldout: 1, training: 0, validation: 0, confirmation: 0}
  used_by_pilot: "lyapunov 50600-50615, 50700-50715; pilot 60601-60603, 60701-60703"

blocks:
  calibration:   # A5: >= 50 samples per code; spacing ~0.09 Lyapunov times (Lorenz 0.1 tu = 0.091)
    ks22:
      fit: {n_traj: 1650, samples_per_traj: 2000, sample_every: 1.84, states: 3300000, per_traj_lyapunov_times: 180,
            memory_float64_GB: 1.69}
      heldout: {n_traj: 165, samples_per_traj: 2000, sample_every: 1.84, states: 330000, stream: 1}
      whole_state_2e16_samples_per_code: 50.4
      patches_fit: {P8: 26400000, P16: 52800000, P32: 105600000, independent_trajectories: 1650}
      patch_samples_per_code_at_2e16: {P8: 403, P16: 806, P32: 1611}
    ks100:
      fit: {n_traj: 1000, samples_per_traj: 500, sample_every: 0.99, states: 500000, per_traj_lyapunov_times: 45,
            memory_float64_GB: 1.02}
      heldout: {n_traj: 100, samples_per_traj: 500, sample_every: 0.99, states: 50000, stream: 1}
      patches_fit: {P8: 4000000, P16: 8000000, P32: 16000000, independent_trajectories: 1000}
      patch_samples_per_code_at_2e16: {P8: 61, P16: 122, P32: 244}
      whole_state_note: "whole-state codebooks on L = 100 meet 50 per code up to 2^13 (61 per code); larger b report the achieved number"
    halving: "A5: the two largest b are refitted on the first half of the fit trajectories (whole trajectories halved)"
  training:      # Lorenz: 100 x 20 tu = 100 x 18.1 Lyapunov times; data axis 1,000 trajectories
    ks22: {n_traj: 100, traj_time: 370.0, lyapunov_times_total: 1811, n_traj_data_axis: 1000, storage: "per-Delta frame grids"}
    ks100: {n_traj: 100, traj_time: 199.0, lyapunov_times_total: 1811, n_traj_data_axis: 1000, storage: "per-Delta frame grids"}
  validation:
    ks22: {n_traj: 50, traj_time: 370.0}
    ks100: {n_traj: 50, traj_time: 199.0}
  confirmation:
    panel_states: 1000
    ks22: {pre_history_time: 120.25, post_time: 555.25, frames_per_state: 2927, disk_float64_GB: 1.50}
    ks100: {pre_history_time: 64.66, post_time: 298.65, frames_per_state: 2918, disk_float64_GB: 5.98}

compute_estimates:
  rate_basis: "measured single-process state-steps/s at dt 0.005: ks22 2.6e5 (batch 1,000), 3.1e5 (batch 100); ks100 6.9e4 (batch 1,000), 1.1e5 (batch 100); estimates use 2.5e5 and 7.0e4 per process, 40 processes, integration only"
  confirmation_panel_1000_incl_burn_in: {ks22: "3.35e8 state-steps, 22 process-min, ~35 s on 40", ks100: "1.73e8, 41 process-min, ~62 s on 40"}
  decode_and_integrate_per_tokenizer_1000_states: {ks22: "1.11e8 state-steps, 7.4 process-min, ~11 s on 40", ks100: "5.97e7, 14 process-min, ~21 s on 40"}
  decode_and_integrate_40_tokenizers: {ks22: "4.9 process-h, ~7.5 min on 40", ks100: "9.5 process-h, ~14 min on 40"}
  calibration_fit_plus_heldout: {ks22: "1.70e9 state-steps, 1.9 process-h, ~3 min on 40", ks100: "2.19e8, 52 process-min, ~1.5 min on 40"}
  training_data_axis_1000_plus_validation: {ks22: "2.9e8, 19 process-min", ks100: "1.5e8, 35 process-min"}
  not_included: "k-means (GPU, th/patchvq.py), bound computation, learned models"
